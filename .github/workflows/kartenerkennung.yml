name: Kartenerkennung aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save sharp@0.33.5
      - run: node build-index.mjs
      - run: |
          git config user.name "kartix-bot"
          git config user.email "kartix-bot@users.noreply.github.com"
          git add vindex.bin vindex.json
          git commit -m "Kartenerkennung aktualisiert" || echo "keine Änderungen"
          git push
