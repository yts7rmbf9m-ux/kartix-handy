<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartix Handy</title>
<meta name="theme-color" content="#1d5cf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kartix">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Werkzeug fürs Handy: oben Aufnahme, darunter Ergebnis, unten Liste. Kartenformat 63:88 als Raster. */
:root{
  --bg:#f3f4f7;--panel:#ffffff;--ink:#16181d;--muted:#6b7180;--line:#e2e5ec;--chip:#eef0f5;
  --accent:#1d5cf2;--accent-ink:#fff;--ok:#1f8a4c;--warn:#b7791f;--bad:#c23b3b;--gold:#ffce40;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --num:"SF Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318;--panel:#1b1e25;--ink:#eef0f4;--muted:#9aa1b0;--line:#2b2f39;--chip:#242833;--accent:#4d82ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111318;--panel:#1b1e25;--ink:#eef0f4;--muted:#9aa1b0;--line:#2b2f39;--chip:#242833;--accent:#4d82ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font)}
body{padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-size:22px;margin:0;letter-spacing:-.3px}
h1 span{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 13px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.5}
select,input{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 10px;min-width:0}
.mode{font-size:13px;padding:6px 10px;border-radius:99px}
.mode.on{background:color-mix(in srgb,var(--gold) 35%,var(--panel));border-color:var(--gold)}
.cam{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;border-radius:14px;
  background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:650;cursor:pointer}
.cam input{display:none}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.manual{display:grid;grid-template-columns:1fr 92px auto;gap:6px}
.status{font-size:14px;color:var(--muted);min-height:20px;margin:6px 2px}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.imgs img{width:100%;aspect-ratio:63/88;object-fit:contain;border-radius:8px;background:var(--chip);display:block}
.cap{font-size:11px;color:var(--muted);text-align:center;margin-top:3px}
.name{font-size:20px;font-weight:700;line-height:1.2}
.sub{color:var(--muted);font-size:14px;margin-top:3px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.prices div{background:var(--chip);border-radius:10px;padding:8px 6px;text-align:center}
.prices b{display:block;font-size:17px;font-family:var(--num);font-variant-numeric:tabular-nums}
.prices span{font-size:11px;color:var(--muted)}
.big{margin-top:12px;padding:14px;border-radius:12px;text-align:center;background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.big b{font-size:32px;font-family:var(--num);font-variant-numeric:tabular-nums}
.big div{font-size:13px;color:var(--muted)}
.big.buy{background:color-mix(in srgb,var(--ok) 15%,var(--panel))}
.big.buy b{color:var(--ok)}
.warn{color:var(--warn);font-size:13px;margin-top:8px}
.cands{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:6px}
.cands button{flex:0 0 98px;padding:4px;text-align:left;font-size:11px;line-height:1.3}
.cands img{width:100%;aspect-ratio:63/88;object-fit:contain;border-radius:6px;background:var(--chip);display:block;margin-bottom:3px}
.cands button.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.list .it{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .it:last-child{border:0}
.list small{color:var(--muted)}
.sum{display:flex;justify-content:space-between;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums}
.spin{width:20px;height:20px;border:3px solid #fff6;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.sheet{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:9;padding:16px}
.sheet .box{width:min(360px,100%)}
.pin{font-size:26px;letter-spacing:8px;text-align:center;width:100%}
[hidden]{display:none!important}
.trader{display:none}
body.handler .trader{display:revert}
</style>
</head>
<body>
<header>
  <h1>Kar<span>tix</span> <small style="font-weight:400;color:var(--muted);font-size:14px">Handy</small></h1>
  <div class="row">
    <select id="lang" aria-label="Sprache der Karte"><option value="de">Deutsch</option><option value="en">Englisch</option>
      <option value="fr">Französisch</option><option value="it">Italienisch</option><option value="es">Spanisch</option></select>
    <button class="mode" id="modeBtn" title="Händler-Modus">🔒 Händler</button>
  </div>
</header>

<label class="cam" id="camBtn"><input type="file" accept="image/*" capture="environment" id="foto"><span id="camTxt">📷 Karte fotografieren</span></label>
<div class="hint">Karte flach und gerade fotografieren, die Nummer unten links (z. B. 4/102) muss scharf sein.
  Sprache oben auf die Kartensprache stellen.</div>

<div class="box">
  <div class="manual">
    <input id="qName" placeholder="Name, z. B. Glurak" autocomplete="off">
    <input id="qNum" placeholder="Nr. 4/102" inputmode="text" autocomplete="off">
    <button id="qGo">Suchen</button>
  </div>
  <div class="status" id="status"></div>
</div>

<div id="res"></div>

<div class="box list" id="listBox" hidden>
  <div class="row" style="justify-content:space-between"><b>Liste</b><button id="clear">leeren</button></div>
  <div id="list"></div>
  <div class="sum"><span>Marktwert <span id="sumM"></span></span><span class="trader">Ankauf <span id="sumA"></span></span></div>
</div>

<div class="box trader" id="traderBox">
  <b>Händler-Einstellungen</b>
  <div class="opts">
    <label>Ankauf in % vom Marktwert<input id="quote" inputmode="decimal" value="80"></label>
    <label>PIN ändern<button id="pinChange" type="button">Neue PIN</button></label>
  </div>
</div>

<div class="sheet" id="pinSheet" hidden>
  <div class="box">
    <b id="pinTitle">PIN eingeben</b>
    <p class="hint" id="pinHint"></p>
    <input class="pin" id="pinIn" type="password" inputmode="numeric" autocomplete="off">
    <div class="row" style="margin-top:10px;justify-content:flex-end"><button id="pinCancel">Abbrechen</button><button class="primary" id="pinOk">OK</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const API = 'https://api.tcgdex.net/v2';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur = v => (+v || 0).toFixed(2).replace('.', ',') + ' €';
const store = {get(k, d) { try { const v = localStorage.getItem('kx_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
               set(k, v) { try { localStorage.setItem('kx_' + k, JSON.stringify(v)); } catch (e) {} }};
const COND = [['NM', 'Near Mint', 1], ['EX', 'Excellent', .8], ['GD', 'Good', .6], ['LP', 'Light Played', .45], ['PL', 'Played', .3], ['PO', 'Poor', .15]];
let state = {cands: [], cur: null, card: null, better: false, cond: 'NM', photo: ''};
let list = store.get('list', []);
$('#lang').value = store.get('lang', 'de');
$('#lang').onchange = () => store.set('lang', $('#lang').value);
$('#quote').value = store.get('quote', 80);
$('#quote').oninput = () => { store.set('quote', +String($('#quote').value).replace(',', '.') || 0); render(); drawList(); };
const status = t => $('#status').textContent = t;

// ---------- Datenbank (TCGdex – Cardmarket-Preise) ----------
async function api(path, maxAge = 864e5) {
  const key = 'c_' + path, hit = store.get(key);
  if (hit && Date.now() - hit.t < maxAge) return hit.d;
  const r = await fetch(API + path);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('Datenbank ' + r.status);
  const d = await r.json();
  if (JSON.stringify(d).length < 400000) store.set(key, {t: Date.now(), d});
  return d;
}
const sets = lang => api(`/${lang}/sets`, 7 * 864e5);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');

async function byNumber(lang, num, total, text) {
  const all = await sets(lang) || [];
  const fit = all.filter(s => !total || +(s.cardCount?.official) === +total || +(s.cardCount?.total) === +total);
  const ids = new Set(fit.map(s => s.id));
  const n = String(parseInt(num, 10));
  const found = new Map();
  for (const q of [n, n.padStart(3, '0'), n.padStart(2, '0')]) {
    const r = await api(`/${lang}/cards?localId=eq:${encodeURIComponent(q)}`).catch(() => []);
    for (const c of r || []) if (ids.has(c.id.replace(/-[^-]+$/, ''))) found.set(c.id, c);
  }
  const t = norm(text);
  return [...found.values()].map(c => ({...c, score: (c.name && t.includes(norm(c.name))) ? 2 : 0,
    setName: (fit.find(s => c.id.startsWith(s.id + '-')) || {}).name || ''}))
    .sort((a, b) => b.score - a.score);
}
async function byName(lang, name, num) {
  const r = await api(`/${lang}/cards?name=${encodeURIComponent(name)}`).catch(() => []);
  const n = num ? String(parseInt(num, 10)) : '';
  let out = (r || []).filter(c => !n || String(parseInt(c.localId, 10)) === n);
  const all = await sets(lang) || [];
  out = out.map(c => ({...c, setName: (all.find(s => c.id.startsWith(s.id + '-')) || {}).name || ''}));
  return out.reverse().slice(0, 30);   // neuere Sets zuerst
}

// Marktwert: Mittel aus Trend / Ø30 / Ø7 (ein Ausreißer zählt nicht); Standard = günstigere Ausführung
function marketOf(card, better) {
  const cm = card?.pricing?.cardmarket || {};
  const series = suf => { const v = ['trend', 'avg30', 'avg7'].map(k => +cm[k + suf] || 0).filter(x => x > 0).sort((a, b) => a - b);
    return {value: v.length ? v[Math.floor(v.length / 2)] : 0, trend: +cm['trend' + suf] || 0, avg30: +cm['avg30' + suf] || 0, low: +cm['low' + suf] || 0}; };
  const opts = [series(''), series('-holo')].filter(s => s.value > 0);
  if (!opts.length) return {value: 0, trend: 0, avg30: 0, low: 0, two: false};
  const pick = better ? opts.reduce((a, b) => a.value >= b.value ? a : b) : opts.reduce((a, b) => a.value <= b.value ? a : b);
  return {...pick, two: opts.length > 1, updated: (cm.updated || '').slice(0, 10)};
}

// ---------- Texterkennung ----------
let worker = null;
async function ocr(file) {
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1800 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = img.width * scale; cv.height = img.height * scale;
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  if (!worker) { status('Texterkennung wird geladen (nur beim ersten Mal) …'); worker = await Tesseract.createWorker(['eng', 'deu']); }
  status('Lese die Karte …');
  const full = (await worker.recognize(cv)).data.text;
  // unteres Fünftel vergrößert nochmal lesen – dort steht die Nummer
  const b = document.createElement('canvas'), h = cv.height * .22;
  b.width = cv.width * 2; b.height = h * 2;
  const bx = b.getContext('2d'); bx.imageSmoothingEnabled = true; bx.drawImage(cv, 0, cv.height - h, cv.width, h, 0, 0, b.width, b.height);
  const bottom = (await worker.recognize(b)).data.text;
  return {text: full + '\n' + bottom, url: cv.toDataURL('image/jpeg', .8)};
}
function numbers(text) {
  const out = [];
  for (const m of text.matchAll(/(\d{1,3})\s*[\/|]\s*(\d{2,3})/g)) if (+m[2] >= 10 && +m[1] <= +m[2] + 120) out.push([m[1], m[2]]);
  return out;
}

// ---------- Ablauf ----------
async function show(cands, info) {
  state.cands = cands; state.better = false; state.cond = 'NM';
  if (!cands.length) { state.card = null; render(info || 'Nicht gefunden – Name und Nummer oben eintippen.'); return; }
  await pick(cands[0].id);
}
async function pick(id) {
  status('Hole Preise …');
  try { state.card = await api(`/${$('#lang').value}/cards/${id}`, 6 * 36e5); state.cur = id; status(''); }
  catch (e) { status('Fehler: ' + e.message); return; }
  render();
}
function render(msg) {
  const c = state.card, q = (+String($('#quote').value).replace(',', '.') || 0) / 100;
  if (!c) { $('#res').innerHTML = msg ? `<div class="box warn">${esc(msg)}</div>` : ''; return; }
  const m = marketOf(c, state.better), f = (COND.find(x => x[0] === state.cond) || COND[0])[2];
  const val = m.value * f;
  const img = c.image ? c.image + '/high.webp' : '';
  const others = state.cands.filter(k => k.id !== state.cur).slice(0, 12);
  $('#res').innerHTML = `<div class="box">
    <div class="imgs" ${state.photo ? '' : 'style="grid-template-columns:minmax(0,220px);justify-content:center"'}>
      ${state.photo ? `<div><img src="${state.photo}" alt=""><div class="cap">Dein Foto</div></div>` : ''}
      <div>${img ? `<img src="${esc(img)}" alt="">` : '<img alt="">'}<div class="cap">Datenbank</div></div></div>
    <div class="name">${esc(c.name)}</div>
    <div class="sub">${esc(c.set?.name || '')} · ${esc(c.localId)}${c.set?.cardCount?.official ? '/' + c.set.cardCount.official : ''}${c.rarity ? ' · ' + esc(c.rarity) : ''}</div>
    ${m.value ? `<div class="prices"><div><b>${eur(m.trend)}</b><span>Trend</span></div><div><b>${eur(m.avg30)}</b><span>Ø 30 Tage</span></div><div><b>${eur(m.low)}</b><span>ab</span></div></div>
      <div class="big"><b>${eur(val)}</b><div>Marktwert${f < 1 ? ` (${state.cond}, ${Math.round(f * 100)} %)` : ' (Near Mint)'} · Cardmarket ${esc(m.updated || '')}</div></div>
      <div class="big buy trader"><b>${eur(val * q)}</b><div>Dein Ankaufspreis (${Math.round(q * 100)} %)</div></div>`
      : '<div class="warn">Für diese Karte gibt es keinen Cardmarket-Preis.</div>'}
    <div class="opts">
      <label>Zustand<select id="cond">${COND.map(x => `<option value="${x[0]}" ${x[0] === state.cond ? 'selected' : ''}>${x[0]} – ${x[1]}</option>`).join('')}</select></label>
      ${m.two ? `<label>Ausführung<select id="better"><option value="0">Standard (günstiger)</option><option value="1" ${state.better ? 'selected' : ''}>Holo / Reverse (teurer)</option></select></label>` : '<span></span>'}
    </div>
    <div class="row" style="margin-top:12px"><button class="primary" id="add" style="flex:1">＋ Zur Liste</button></div>
    ${others.length ? `<div class="sub" style="margin-top:12px">Nicht die richtige? Andere Treffer:</div><div class="cands">${others.map(k =>
      `<button data-id="${esc(k.id)}">${k.image ? `<img src="${esc(k.image)}/low.webp" alt="" loading="lazy">` : ''}${esc(k.name)}<br>${esc(k.setName || '')} ${esc(k.localId)}</button>`).join('')}</div>` : ''}
  </div>`;
  $('#cond').onchange = e => { state.cond = e.target.value; render(); };
  if ($('#better')) $('#better').onchange = e => { state.better = e.target.value === '1'; render(); };
  $('#add').onclick = () => { list.push({name: c.name, set: c.set?.name || '', nr: c.localId, cond: state.cond, value: val});
    store.set('list', list); drawList(); $('#add').disabled = true; $('#add').textContent = '✓ in der Liste'; };
  document.querySelectorAll('.cands button').forEach(b => b.onclick = () => pick(b.dataset.id));
}
function drawList() {
  const q = (+String($('#quote').value).replace(',', '.') || 0) / 100;
  $('#listBox').hidden = !list.length;
  $('#list').innerHTML = list.map((x, i) => `<div class="it"><span>${esc(x.name)} <small>${esc(x.set)} ${esc(x.nr)} · ${esc(x.cond)}</small></span>
    <span style="white-space:nowrap">${eur(x.value)}<span class="trader"> · ${eur(x.value * q)}</span> <a href="#" data-i="${i}" style="color:var(--bad);text-decoration:none">✕</a></span></div>`).join('');
  $('#sumM').textContent = eur(list.reduce((a, x) => a + x.value, 0));
  $('#sumA').textContent = eur(list.reduce((a, x) => a + x.value * q, 0));
  document.querySelectorAll('#list a').forEach(a => a.onclick = e => { e.preventDefault(); list.splice(+a.dataset.i, 1); store.set('list', list); drawList(); });
}
let clearArmed = false;
$('#clear').onclick = () => { if (!clearArmed) { clearArmed = true; $('#clear').textContent = 'wirklich leeren?'; setTimeout(() => { clearArmed = false; $('#clear').textContent = 'leeren'; }, 3000); return; }
  list = []; store.set('list', list); drawList(); };

$('#foto').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $('#camTxt').innerHTML = '<span class="spin"></span>&nbsp;Erkenne Karte …'; $('#foto').disabled = true;
  try {
    const {text, url} = await ocr(f); state.photo = url;
    const nums = numbers(text), lang = $('#lang').value;
    let cands = [];
    for (const [n, t] of nums) { cands = await byNumber(lang, n, t, text); if (cands.length) break; }
    if (nums[0]) $('#qNum').value = nums[0].join('/');
    status(cands.length ? `Nummer ${nums[0].join('/')} gelesen` : (nums.length ? `Nummer ${nums[0].join('/')} gelesen, aber keine Karte gefunden` : 'Keine Nummer lesbar – Name/Nummer eintippen'));
    await show(cands, 'Nicht erkannt – Name und Nummer oben eintippen und „Suchen“.');
  } catch (err) { status('Fehler: ' + err.message); }
  $('#camTxt').textContent = '📷 Nächste Karte fotografieren'; $('#foto').disabled = false; e.target.value = '';
};
async function manual() {
  const name = $('#qName').value.trim(), nr = $('#qNum').value.trim(), lang = $('#lang').value;
  const m = nr.match(/(\d{1,3})\s*\/\s*(\d{2,3})/);
  status('Suche …'); state.photo = '';
  try {
    let c = [];
    if (m) c = await byNumber(lang, m[1], m[2], name);
    if (name && (!c.length || !c.some(x => x.score))) { const byN = await byName(lang, name, m ? m[1] : nr); if (byN.length) c = byN; }
    status(c.length ? `${c.length} Treffer` : 'Keine Treffer');
    await show(c);
  } catch (e) { status('Fehler: ' + e.message); }
}
$('#qGo').onclick = manual;
['#qName', '#qNum'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') manual(); }));

// ---------- Händler-Modus mit PIN ----------
async function hash(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kartix:' + s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function askPin(title, hint) {
  return new Promise(res => {
    $('#pinTitle').textContent = title; $('#pinHint').textContent = hint || ''; $('#pinIn').value = ''; $('#pinSheet').hidden = false;
    setTimeout(() => $('#pinIn').focus(), 50);
    const done = v => { $('#pinSheet').hidden = true; $('#pinOk').onclick = $('#pinCancel').onclick = null; res(v); };
    $('#pinOk').onclick = () => done($('#pinIn').value.trim()); $('#pinCancel').onclick = () => done(null);
    $('#pinIn').onkeydown = e => { if (e.key === 'Enter') done($('#pinIn').value.trim()); };
  });
}
function setMode(on) { document.body.classList.toggle('handler', on); $('#modeBtn').classList.toggle('on', on);
  $('#modeBtn').textContent = on ? '🔓 Händler' : '🔒 Händler'; sessionStorage.setItem('kx_h', on ? '1' : ''); render(); drawList(); }
async function newPin() {
  const p = await askPin('Neue PIN festlegen', '4–8 Ziffern. Damit schaltest du den Händler-Modus (Ankaufspreise) frei.');
  if (!p || p.length < 4) return false;
  store.set('pin', await hash(p)); return true;
}
$('#modeBtn').onclick = async () => {
  if (document.body.classList.contains('handler')) return setMode(false);
  if (!store.get('pin')) { if (await newPin()) setMode(true); return; }
  const p = await askPin('PIN eingeben', 'Händler-Modus zeigt Ankaufspreise.');
  if (p && await hash(p) === store.get('pin')) setMode(true); else if (p) status('PIN falsch.');
};
$('#pinChange').onclick = () => newPin().then(ok => ok && status('PIN geändert.'));
try { if (sessionStorage.getItem('kx_h') === '1') setMode(true); } catch (e) {}
drawList();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
